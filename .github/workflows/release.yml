name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing: Node >= 22.14, npm CLI >= 11.5.1
          node-version: 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing @kyloc20/oss-sdk@$PKG_VERSION"

      - name: Typecheck
        run: pnpm typecheck

      - name: Log Node and npm versions
        run: |
          node -v
          npm -v

      # Bootstrap (first publish): NPM_TOKEN = granular token with Bypass 2FA on @kyloc20.
      # npm uses OIDC when Trusted Publisher is configured; token is fallback until then.
      # After @kyloc20/oss-sdk is on npm and Trusted Publisher is set:
      #   1. Remove the env block below.
      #   2. Bump version, push tag, confirm Release passes without NPM_TOKEN.
      #   3. Delete the NPM_TOKEN secret and revoke the bootstrap token on npm.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
