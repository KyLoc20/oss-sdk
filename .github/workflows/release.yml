name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing: Node >= 22.14, npm CLI >= 11.5.1
          node-version: 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing @kyloc20/oss-sdk@$PKG_VERSION"

      - name: Typecheck
        run: pnpm typecheck

      # Node 22 ships npm 10; Trusted Publishing needs npm >= 11.5.1 or publish gets E404.
      - name: Upgrade npm for Trusted Publishing
        run: |
          node -v
          npm install -g npm@^11.5.1
          npm -v

      # Trusted Publishing (OIDC). Do not set NODE_AUTH_TOKEN on this step.
      - name: Publish to npm
        run: npm publish --access public
